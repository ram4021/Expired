    <script>
      document.addEventListener(&#34;DOMContentLoaded&#34;, function() {
            var emailInput = document.getElementById(&#34;email_address&#34;);
            var rememberCheckbox = document.getElementById(&#34;customControlAutosizing&#34;);

            // Check if email is stored in localStorage
            var storedEmail = localStorage.getItem(&#34;rememberedEmail&#34;);
            if (storedEmail) {
                emailInput.value = storedEmail;
                rememberCheckbox.checked = true;
            }

            // Listen for changes in the remember checkbox
            rememberCheckbox.addEventListener(&#34;change&#34;, function() {
                if (rememberCheckbox.checked) {
                    // Store email in localStorage
                    localStorage.setItem(&#34;rememberedEmail&#34;, emailInput.value);
                } else {
                    // Remove stored email if checkbox is unchecked
                    localStorage.removeItem(&#34;rememberedEmail&#34;);
                }
            });
        });
    </script>
